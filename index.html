<style>

const LS = {profile:'porikkhasathi_profile_v1',checks:'porikkhasathi_checks_v1',ui:'porikkhasathi_ui_v1',reminders:'porikkhasathi_reminders_v1'};

function readStore(key,fallback){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch(e){return fallback}}
function saveStore(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){toast('ডিভাইসের স্টোরেজে সেভ করা যায়নি। ডেটা Export করে রাখো।')}}
let profile={...DEFAULT_PROFILE,...readStore(LS.profile,{})};profile.name='Farishta';

let installPrompt=null;
const TYPE_LABEL={daily:'দৈনিক পরীক্ষা',weekly:'সাপ্তাহিক পরীক্ষা',monthly:'মাসিক পরীক্ষা',catchup:'রিভিশন / ক্যাচ-আপ'};
const TYPE_CLASS={daily:'type-daily',weekly:'type-weekly',monthly:'type-monthly',catchup:'type-catchup'};
const NAV=[{id:'home',label:'ড্যাশবোর্ড',icon:'home'},{id:'routine',label:'রুটিন',icon:'calendar'},{id:'history',label:'আর্কাইভ',icon:'archive'},{id:'progress',label:'অগ্রগতি',icon:'chart'},{id:'settings',label:'সেটিংস',icon:'settings'}];
function icon(name){const paths={home:'<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-6h6v6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m8 15 2 2 5-5"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 5-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z"/>',check:'<path d="m5 12 4 4L19 6"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',book:'<path d="M4 5.8c2.7-1 5.4-.5 8 1.2v12c-2.6-1.7-5.3-2.2-8-1.2z"/><path d="M20 5.8c-2.7-1-5.4-.5-8 1.2v12c2.6-1.7 5.3-2.2 8-1.2z"/>',exam:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6m-6 4h3"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.check}</svg>`}
function localISO(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function today(){return localISO()}
function parseDate(s){return new Date(s+'T12:00:00')}
function dateLabel(s,opts={weekday:'long',day:'numeric',month:'long'}){return parseDate(s).toLocaleDateString('bn-BD',opts)}
function shortDate(s){return parseDate(s).toLocaleDateString('bn-BD',{day:'numeric',month:'short'})}
function rangeLabel(p){return `${shortDate(p.start)} – ${shortDate(p.end)}`}
function currentPart(){const d=today();return PARTS.find(p=>d>=p.start&&d<=p.end)|| (d<PARTS[0].start?PARTS[0]:PARTS[PARTS.length-1])}
function allTasks(){return PARTS.flatMap(p=>p.tasks.map(t=>({...t,partId:p.id,partTitle:p.title})))}
function taskState(t){return checks[t.id]||{study:false,exam:false}}
function taskDoneCount(t){const s=taskState(t);return Number(s.study)+Number(s.exam)}
function taskCompleted(t){const s=taskState(t);return s.study&&s.exam}
function metrics(tasks=allTasks()){const total=tasks.length;let study=0,exam=0,both=0;for(const t of tasks){const s=taskState(t);study+=Number(s.study);exam+=Number(s.exam);both+=Number(s.study&&s.exam)}return {total,study,exam,both,checks:study+exam,totalChecks:total*2,percent:total?Math.round((study+exam)/(total*2)*100):0}}
function partMetrics(p){return metrics(p.tasks)}
function allExamTasks(){return allTasks().filter(t=>t.type!=='catchup')}
function availableTasks(){return PARTS.filter(p=>p.start<=today()).flatMap(p=>p.tasks.map(t=>({...t,partId:p.id,partTitle:p.title})))}
function availableExamTasks(){return availableTasks().filter(t=>t.type!=='catchup')}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function setTab(tab){ui.tab=tab;saveStore(LS.ui,ui);render();window.scrollTo(0,0);const v=document.getElementById('view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter')}
function setCheck(id,type,val){const was=allDoneToday();checks[id]={...(checks[id]||{study:false,exam:false}),[type]:val};saveStore(LS.checks,checks);render();const el=document.querySelector(`input[data-id="${id}"][data-check="${type}"]`);if(el){el.focus({preventScroll:true});el.parentNode.classList.add('pop');const c=el.closest('.task-card');if(c&&c.classList.contains('completed'))c.classList.add('cele')}if(val)cheer(type==='study'?'পড়া সম্পন্ন হিসেবে সেভ হয়েছে':'পরীক্ষা সম্পন্ন হিসেবে সেভ হয়েছে');else toast('চেকমার্ক আপডেট হয়েছে');if(!was&&allDoneToday())party()}
function resetCheck(id){delete checks[id];saveStore(LS.checks,checks);render()}
function renderNav(){document.getElementById('navInner').innerHTML=NAV.map(n=>`<button class="nav-btn ${ui.tab===n.id?'active':''}" data-tab="${n.id}">${icon(n.icon)}<span>${n.label}</span></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)))}
function taskCard(t,options={}){const s=taskState(t),done=s.study&&s.exam;const topicLines=String(t.topics||'').split('\n').map(x=>`<div class="topic-line">${escapeHTML(x)}</div>`).join('');const studyText=t.type==='catchup'?'পড়া / রিভিশন শেষ':'পড়া শেষ করেছি';const examText=t.type==='catchup'?'বাকি পরীক্ষা / ভুল সংশোধন শেষ':'পরীক্ষা দিয়েছি';return `<article class="task-card ${done?'completed':(s.study||s.exam?'partial':'')}" id="task-${escapeHTML(t.id)}"><div class="task-top"><div><div class="task-label"><span class="type-pill ${TYPE_CLASS[t.type]}">${TYPE_LABEL[t.type]}</span>${t.type==='catchup'?'':`<span class="task-meta">${escapeHTML(t.partTitle||'')}</span>`}</div><div class="task-title">${escapeHTML(t.title)}</div><div class="task-meta">${dateLabel(t.date,{weekday:'short',day:'numeric',month:'long'})}</div></div>${done?`<span class="tag">${icon('check')} সম্পন্ন</span>`:''}</div><div class="task-topic">${topicLines}${t.source?`<div class="source-line">মূল PDF: ${escapeHTML(t.source)}</div>`:''}</div><div class="check-row"><label class="check-control ${s.study?'checked':''}"><input type="checkbox" data-check="study" data-id="${escapeHTML(t.id)}" ${s.study?'checked':''} aria-label="${escapeHTML(studyText)}"><span class="check-label">${studyText}</span></label><label class="check-control ${s.exam?'checked':''}"><input type="checkbox" data-check="exam" data-id="${escapeHTML(t.id)}" ${s.exam?'checked':''} aria-label="${escapeHTML(examText)}"><span class="check-label">${examText}</span></label></div></article>`}
function bindCheckInputs(root=document){root.querySelectorAll('input[data-check]').forEach(el=>el.addEventListener('change',()=>setCheck(el.dataset.id,el.dataset.check,el.checked)))}
function tasksForDate(date){return allTasks().filter(t=>t.date===date)}
function getUpcomingTaskDays(){return [...new Set(allTasks().map(t=>t.date))].filter(d=>d>=today()).sort()}
function dayBlock(date,tasks){const done=tasks.filter(taskCompleted).length;return `<section class="day-block"><div class="day-heading"><div class="day-date"><strong>${parseDate(date).toLocaleDateString('bn-BD',{day:'numeric'})}</strong><span>${parseDate(date).toLocaleDateString('bn-BD',{month:'short'})}</span></div><div><div class="day-name">${dateLabel(date,{weekday:'long'})}</div><div class="day-count">${tasks.length}টি কাজ · ${done}টি সম্পূর্ণ</div></div><div class="day-rule"></div></div><div class="task-list ${tasks.length>1?'two-col':''}">${tasks.map(t=>taskCard(t)).join('')}</div></section>`}
function greetingForHour(hour=new Date().getHours()){if(hour>=5&&hour<12)return 'Good morning';if(hour>=12&&hour<17)return 'Good afternoon';if(hour>=17&&hour<21)return 'Good evening';return 'Good night'}
function updateGreeting(){const el=document.querySelector('[data-greeting]');if(el)el.textContent=greetingForHour()}
function homeView(){const date=today(),p=currentPart(),todayTasks=tasksForDate(date),m=metrics(availableExamTasks()),pm=partMetrics(p),todayDone=todayTasks.filter(taskCompleted).length;const pct=pm.total?Math.round(pm.both/pm.total*100):0;const nextTask=p.tasks.find(t=>t.date>date);const beforeStart=date<PARTS[0].start;const completedExams=availableExamTasks().filter(taskCompleted).length;const greeting=greetingForHour();const goalPct=todayTasks.length?Math.round(todayDone/todayTasks.length*100):0;const displayName=profile.name||'শিক্ষার্থী';const initial=Array.from(String(displayName).trim())[0]||'S';return `<div class="welcome"><div class="welcome-copy"><div class="greeting-row"><div class="greeting-copy"><div class="greeting-time" data-greeting>${greeting}</div><div class="welcome-name">${escapeHTML(displayName)}</div></div></div><h1>আজকের লক্ষ্য<br><span class="gradient-text">আজই শেষ করো।</span></h1><div class="muted" style="font-size:13px">একবারে একটি টাস্ক। ধারাবাহিকতাই সাফল্য।</div></div><div class="side">${mascot('girl')}</div><div class="date-pill"><strong>${dateLabel(date,{day:'numeric',month:'long',year:'numeric'})}</strong>আজকের পরিকল্পনা</div></div>

function routineView(partId=null){const p=PARTS.find(x=>x.id===partId)||currentPart();const m=partMetrics(p);const groups={};p.tasks.forEach(t=>(groups[t.date]??=[]).push(t));return `<div class="content-page"><div class="eyebrow">তোমার রুটিন</div><h1 class="page-title">${p.title} <span class="gradient-text">রুটিন</span></h1><p class="page-sub">${rangeLabel(p)} · এই পর্বের প্রতিটি কাজের জন্য পড়া ও পরীক্ষা আলাদাভাবে ট্র্যাক করো।</p><div class="part-card active-part"><div class="part-top"><div><div class="part-title">${p.title} · ${p.tasks.length}টি কাজ</div><div class="part-date">${dateLabel(p.start,{day:'numeric',month:'long'})} – ${dateLabel(p.end,{day:'numeric',month:'long',year:'numeric'})}</div></div><span class="tag">${m.both}/${m.total} সম্পূর্ণ</span></div><div class="part-meter"><div class="meter-track"><div class="meter-fill" style="width:${m.percent}%"></div></div><div class="meter-copy">${m.percent}% অগ্রগতি</div></div><div class="part-actions"><button class="ghost-btn" data-jump="progress">অগ্রগতি দেখো</button>${p.id>1?`<button class="ghost-btn" data-jump="history">আগের পর্ব</button>`:''}</div></div><div class="notice" style="margin-bottom:18px">শুধু বর্তমান পর্ব দেখানো হচ্ছে। আগের পর্ব দেখতে আর্কাইভে যাও।</div>${Object.keys(groups).sort().map(d=>dayBlock(d,groups[d])).join('')}</div>`}
function historyView(){const past=PARTS.filter(p=>p.end<today());let selected=ui.archivePart?PARTS.find(p=>p.id===ui.archivePart):null;if(selected&&selected.end>=today())selected=null;if(selected){return `<div class="content-page"><div class="eyebrow">আগের পর্ব</div><h1 class="page-title">আর্কাইভ <span class="gradient-text">/ ${selected.title}</span></h1><p class="page-sub">আগের পর্বের কাজ ও চেকমার্ক এখানে দেখা ও আপডেট করা যাবে।</p><button class="ghost-btn" id="backArchive">← সব আগের পর্ব</button><div style="height:14px"></div>${routineView(selected.id)}</div>`}return `<div class="content-page"><div class="eyebrow">আগের পর্বগুলো</div><h1 class="page-title">পর্বের <span class="gradient-text">আর্কাইভ</span></h1><p class="page-sub">আগের পর্বের সব টপিক ও তোমার সংরক্ষিত অগ্রগতি এখানে থাকবে। ভবিষ্যতের পর্ব দেখা যাবে না।</p>${past.length?past.slice().reverse().map(p=>{const m=partMetrics(p);return `<div class="part-card"><div class="part-top"><div><div class="part-title">${p.title}</div><div class="part-date">${rangeLabel(p)} · ${p.tasks.length}টি কাজ</div></div><span class="tag">${m.both}/${m.total} সম্পূর্ণ</span></div><div class="part-meter"><div class="meter-track"><div class="meter-fill" style="width:${m.percent}%"></div></div><div class="meter-copy">${m.percent}%</div></div><div class="part-actions"><button class="secondary-btn" data-archive="${p.id}">এই পর্ব দেখো ↗</button></div></div>`}).join(''):`<div class="empty-state"><div class="big-icon">${icon('lock')}</div><strong style="color:var(--text)">এখনো কোনো পর্ব আর্কাইভে যায়নি</strong><br>বর্তমান পর্ব শেষ হলে সেটি এখানে দেখা যাবে। ভবিষ্যতের পর্ব এখন লুকানো আছে।</div>`}</div>`}
function progressView(){const all=metrics(availableTasks());const exams=metrics(availableExamTasks());const completed=availableExamTasks().filter(taskCompleted).length;const p=currentPart();const pm=partMetrics(p);return `<div class="content-page"><div class="eyebrow">তোমার অগ্রগতি</div><h1 class="page-title">তোমার <span class="gradient-text">অগ্রগতি</span></h1><p class="page-sub">পড়া শেষ করা, পরীক্ষা দেওয়া এবং পর্বভিত্তিক ধারাবাহিকতা—সব এক জায়গায়।</p><div class="summary-grid"><div class="summary-box"><span>পড়া সম্পন্ন</span><strong>${all.study.toLocaleString('bn-BD')} <span style="font-size:13px;color:var(--muted)">/ ${all.total.toLocaleString('bn-BD')}</span></strong></div><div class="summary-box"><span>পরীক্ষা দেওয়া</span><strong>${all.exam.toLocaleString('bn-BD')} <span style="font-size:13px;color:var(--muted)">/ ${all.total.toLocaleString('bn-BD')}</span></strong></div><div class="summary-box"><span>পড়া + পরীক্ষা দুটোই</span><strong>${completed.toLocaleString('bn-BD')} <span style="font-size:13px;color:var(--muted)">/ ${exams.total.toLocaleString('bn-BD')}</span></strong></div><div class="summary-box"><span>সব চেকমার্কের অগ্রগতি</span><strong>${all.percent}%</strong></div></div><div class="settings-group"><h3>বর্তমান পর্ব · ${p.title}</h3><p>${rangeLabel(p)} · শুধু বর্তমান পর্বের অগ্রগতি</p><div class="chart-bars"><div class="bar-row"><span>পড়া শেষ</span><div class="bar-bg"><div class="bar-fill" style="width:${pm.total?pm.study/pm.total*100:0}%"></div></div><span class="bar-value">${pm.study}/${pm.total}</span></div><div class="bar-row"><span>পরীক্ষা</span><div class="bar-bg"><div class="bar-fill" style="width:${pm.total?pm.exam/pm.total*100:0}%"></div></div><span class="bar-value">${pm.exam}/${pm.total}</span></div><div class="bar-row"><span>দুটিই শেষ</span><div class="bar-bg"><div class="bar-fill" style="width:${pm.total?pm.both/pm.total*100:0}%"></div></div><span class="bar-value">${pm.both}/${pm.total}</span></div></div></div><div class="settings-group"><h3>পর্বভিত্তিক অগ্রগতি</h3><p>এখন পর্যন্ত চালু হওয়া পর্বগুলো। ভবিষ্যতের পর্ব লুকানো রাখা হয়েছে।</p><div class="chart-bars">${PARTS.filter(x=>x.start<=today()).map(x=>{const z=partMetrics(x);return `<div class="bar-row"><span>${x.title}</span><div class="bar-bg"><div class="bar-fill" style="width:${z.percent}%"></div></div><span class="bar-value">${z.percent}%</span></div>`}).join('')}</div></div><div class="notice">তোমার অগ্রগতি এই ডিভাইসে সংরক্ষিত থাকবে।</div></div>`}
function settingsView(){return `<div class="content-page"><div class="eyebrow">নিজের মতো সাজাও</div><h1 class="page-title">অ্যাপের <span class="gradient-text">সেটিংস</span></h1><p class="page-sub">থিম আর রিমাইন্ডার ঠিক করে নাও।</p><section class="settings-group pf"><div class="profile-preview"><div class="side" style="flex:none">${mascot('girl')}</div><div><div class="profile-kicker">তোমার প্রোফাইল</div><div class="profile-preview-name">Farishta</div><div class="profile-preview-note">Study with Joy. Grow Every Day.</div></div></div></section><section class="settings-group"><h3>অ্যাপের থিম</h3><p>পছন্দের রং বেছে নাও।</p><div class="theme-options"><button class="theme-option ${profile.theme==='emerald'?'selected':''}" data-theme="emerald"><div class="theme-swatch" style="background:linear-gradient(120deg,#eef9f1,#43b184,#f29bb0)"></div><strong>Matcha</strong><span>মিন্ট সবুজ</span></button><button class="theme-option ${profile.theme==='midnight'?'selected':''}" data-theme="midnight"><div class="theme-swatch" style="background:linear-gradient(120deg,#15122c,#5a3fc0,#ff9bbf)"></div><strong>Midnight</strong><span>ইন্ডিগো ডার্ক</span></button><button class="theme-option ${profile.theme==='light'?'selected':''}" data-theme="light"><div class="theme-swatch" style="background:linear-gradient(120deg,#f7f1ff,#8d70f2,#f08aa8)"></div><strong>Lavender</strong><span>হালকা ল্যাভেন্ডার</span></button></div></section><section class="settings-group"><h3>রিমাইন্ডার</h3><p>অ্যাপ খোলা থাকলে এই ডিভাইসে আজকের কাজ ও দিনশেষের বাকি কাজ মনে করিয়ে দেবে।</p><div class="setting-line"><div><strong>সকালের রিমাইন্ডার</strong></div><label class="switch"><input id="startReminder" aria-label="সকালের রিমাইন্ডার" type="checkbox" ${profile.startReminder?'checked':''}><span class="slider-ui"></span></label></div><div class="field" style="margin-top:12px"><label class="field-label" for="morningTime">সকালের সময়</label><input id="morningTime" class="time-input" type="time" value="${escapeHTML(profile.morning)}"></div><div class="setting-line" style="margin-top:14px"><div><strong>রাতের রিমাইন্ডার</strong></div><label class="switch"><input id="endReminder" aria-label="রাতের রিমাইন্ডার" type="checkbox" ${profile.endReminder?'checked':''}><span class="slider-ui"></span></label></div><div class="field" style="margin-top:12px"><label class="field-label" for="eveningTime">রাতের সময়</label><input id="eveningTime" class="time-input" type="time" value="${escapeHTML(profile.evening)}"></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="primary-btn" id="enableNotifications">${icon('bell')} রিমাইন্ডার চালু করো</button><button class="ghost-btn" id="saveReminder">সময় সেভ করো</button></div></section><section class="settings-group"><h3>মোবাইলে ইনস্টল</h3><button class="secondary-btn" id="installSettings">${icon('download')} অ্যাপ ইনস্টল করো</button></section><details class="advanced-details"><summary>ডেটা ব্যাকআপ ও রিসেট</summary><div class="advanced-body"><p>প্রয়োজনে অগ্রগতির কপি রেখে দিতে পারো অথবা আগের কপি ফিরিয়ে আনতে পারো।</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="ghost-btn" id="exportData">ডেটা ব্যাকআপ নাও</button><label class="ghost-btn" for="importFile">ব্যাকআপ ফিরিয়ে আনো</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div><div style="margin-top:16px"><button class="ghost-btn" id="resetProgress" style="border-color:rgba(244,166,166,.25);color:var(--red)">সব চেকমার্ক মুছে ফেলো</button></div></div></details><div class="footer-note">StudyFlow · প্রতিদিন একটু করে এগিয়ে যাও।</div></div>`}
function render(){document.documentElement.dataset.theme=profile.theme;const chrome=(PAL[profile.theme]||PAL.light);const themeMeta=document.querySelector('meta[name="theme-color"]');if(themeMeta)themeMeta.content=chrome.theme;const view=document.getElementById('view');if(ui.tab==='home')view.innerHTML=homeView();else if(ui.tab==='routine')view.innerHTML=routineView();else if(ui.tab==='history')view.innerHTML=historyView();else if(ui.tab==='progress')view.innerHTML=progressView();else view.innerHTML=settingsView();renderNav();bindCheckInputs(view);bindActions(view);}
function bindActions(root=document){root.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.jump)));root.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',()=>{ui.archivePart=Number(b.dataset.archive);saveStore(LS.ui,ui);render()}));const back=root.querySelector('#backArchive');if(back)back.addEventListener('click',()=>{ui.archivePart=null;saveStore(LS.ui,ui);render()});const saveName=root.querySelector('#saveName');if(saveName)saveName.addEventListener('click',()=>{const val=root.querySelector('#profileName').value.trim();profile.name=val||'শিক্ষার্থী';saveStore(LS.profile,profile);render();toast('প্রোফাইল সেভ হয়েছে')});root.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{profile.theme=b.dataset.theme;saveStore(LS.profile,profile);render();toast('থিম পরিবর্তন হয়েছে')}));const start=root.querySelector('#startReminder'),end=root.querySelector('#endReminder');if(start)start.addEventListener('change',()=>{profile.startReminder=start.checked;saveStore(LS.profile,profile)});if(end)end.addEventListener('change',()=>{profile.endReminder=end.checked;saveStore(LS.profile,profile)});const saveReminder=root.querySelector('#saveReminder');if(saveReminder)saveReminder.addEventListener('click',()=>{profile.morning=root.querySelector('#morningTime').value||'08:00';profile.evening=root.querySelector('#eveningTime').value||'22:30';profile.startReminder=root.querySelector('#startReminder').checked;profile.endReminder=root.querySelector('#endReminder').checked;saveStore(LS.profile,profile);toast('রিমাইন্ডারের সময় সেভ হয়েছে')});const enable=root.querySelector('#enableNotifications');if(enable)enable.addEventListener('click',enableNotificationPermission);const ex=root.querySelector('#exportData');if(ex)ex.addEventListener('click',exportData);const im=root.querySelector('#importFile');if(im)im.addEventListener('change',importData);const reset=root.querySelector('#resetProgress');if(reset)reset.addEventListener('click',()=>{if(confirm('সব পড়া ও পরীক্ষা চেকমার্ক মুছে ফেলবে? এই কাজ ফিরিয়ে আনা যাবে না।')){checks={};saveStore(LS.checks,checks);render();toast('অগ্রগতি রিসেট হয়েছে')}});const inst=root.querySelector('#installSettings');if(inst)inst.addEventListener('click',installApp)}
function exportData(){const data={app:'StudyFlow',version:1,exportedAt:new Date().toISOString(),profile,checks,reminderLog};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`studyflow-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('ব্যাকআপ ফাইল তৈরি হয়েছে')}
function importData(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||typeof data!=='object'||!data.checks)throw new Error('invalid');if(!confirm('Import করলে বর্তমান প্রোফাইল ও চেকমার্ক ব্যাকআপের ডেটা দিয়ে প্রতিস্থাপন হবে। চালিয়ে যাবে?'))return;profile={...DEFAULT_PROFILE,...(data.profile||{})};profile.name='Farishta';checks=data.checks||{};reminderLog=data.reminderLog||{};saveStore(LS.profile,profile);saveStore(LS.checks,checks);saveStore(LS.reminders,reminderLog);render();toast('ব্যাকআপ Import সম্পন্ন হয়েছে')}catch(err){toast('ফাইলটি সঠিক ব্যাকআপ JSON নয়')}finally{e.target.value=''}};reader.readAsText(file)}
async function enableNotificationPermission(){if(!('Notification'in window)){toast('এই ডিভাইসে রিমাইন্ডার চালু করা যাচ্ছে না');return}try{const permission=await Notification.requestPermission();profile.notifications=permission==='granted';saveStore(LS.profile,profile);render();toast(permission==='granted'?'রিমাইন্ডার চালু হয়েছে':permission==='denied'?'রিমাইন্ডার চালু করা যায়নি':'অনুমতি দেওয়া হয়নি');if(permission==='granted')showNotification('StudyFlow চালু হয়েছে','আজকের রুটিন ও অসমাপ্ত কাজের রিমাইন্ডার এখানে দেখানো হবে।')}catch(e){toast('নোটিফিকেশন অনুমতি নেওয়া যায়নি')}}
function showNotification(title,body,tag='studyflow'){if(!('Notification'in window)||Notification.permission!=='granted')return;try{const n=new Notification(title,{body,tag,icon:makeIcon(192),badge:makeIcon(96)});n.onclick=()=>{window.focus();setTab('home');n.close()}}catch(e){}}
function reminderKey(date,type){return `${date}_${type}`}
function checkReminders(){if(!profile.notifications||!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date();const date=localISO(now),mins=now.getHours()*60+now.getMinutes();const start=profile.morning||'08:00',end=profile.evening||'22:30';const startM=Number(start.slice(0,2))*60+Number(start.slice(3,5)),endM=Number(end.slice(0,2))*60+Number(end.slice(3,5));const tasks=tasksForDate(date);if(profile.startReminder&&mins>=startM&&mins<startM+5&&!reminderLog[reminderKey(date,'start')]){reminderLog[reminderKey(date,'start')]=true;saveStore(LS.reminders,reminderLog);if(tasks.length){const labels=tasks.map(t=>t.title).join(', ');showNotification('আজকের টাস্ক প্রস্তুত',`${labels} — পড়া শেষ ও পরীক্ষা দেওয়ার চেকমার্ক আপডেট করো।`,'studyflow-start-'+date)}else{showNotification('আজকের রুটিন', 'আজ নতুন পরীক্ষা নেই। রিভিশন বা অসমাপ্ত কাজ শেষ করো।','studyflow-start-'+date)}}if(profile.endReminder&&mins>=endM&&mins<endM+5&&!reminderLog[reminderKey(date,'end')]){reminderLog[reminderKey(date,'end')]=true;saveStore(LS.reminders,reminderLog);const pending=tasks.filter(t=>!taskCompleted(t));if(pending.length){const short=pending.map(t=>{const s=taskState(t);return `${t.title} (${!s.study?'পড়া বাকি':''}${!s.study&&!s.exam?' + ':''}${!s.exam?'পরীক্ষা বাকি':''})`}).join('; ');showNotification('দিনশেষের রিমাইন্ডার',`এখনো অসম্পূর্ণ: ${short}`,'studyflow-end-'+date)}}}
let manifestObjectUrl=null;function createManifest(){try{const here=new URL(location.href);const base=new URL('./',here);const palette=(PAL[profile.theme]||PAL.light);const data={id:here.pathname,name:'StudyFlow',short_name:'StudyFlow',description:'দৈনিক পড়া, পরীক্ষা, রুটিন ও অগ্রগতি ট্র্যাকার',start_url:here.href.split('#')[0],scope:base.href,display:'standalone',orientation:'portrait-primary',background_color:palette.background,theme_color:palette.theme,icons:[{src:makeIcon(192),sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:makeIcon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};const blob=new Blob([JSON.stringify(data)],{type:'application/manifest+json'});if(manifestObjectUrl)URL.revokeObjectURL(manifestObjectUrl);manifestObjectUrl=URL.createObjectURL(blob);document.getElementById('dynamicManifest').href=manifestObjectUrl}catch(e){}}
function makeIcon(size){try{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,'#9a7ef5');g.addColorStop(1,'#6a4fd4');x.fillStyle=g;x.fillRect(0,0,size,size);x.fillStyle='#ffe08a';x.beginPath();const cx=size/2,cy=size*.52,R=size*.27,r=R*.48;for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;x.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}x.closePath();x.fill();return c.toDataURL('image/png')}catch(e){return ''}}
async function installApp(){if(installPrompt){installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;return}if(/iphone|ipad|ipod/i.test(navigator.userAgent)){toast('Share মেনু থেকে “Add to Home Screen” বেছে নাও');return}toast('এই মুহূর্তে ইনস্টল অপশন পাওয়া যাচ্ছে না।')}
const PAL={emerald:{theme:'#eef9f1',background:'#eef9f1'},midnight:{theme:'#1d1840',background:'#15122c'},light:{theme:'#f7f1ff',background:'#f7f1ff'}};
const VB={girl:['0 0 200 200','girl'],cat:['0 0 120 110','cat'],'cat-happy':['0 0 120 110','cat']};
function mascot(n){if(n==='girl')return '<span class="m art-girl" aria-hidden="true"></span>';return `<svg class="m m-${n}" viewBox="0 0 120 110" aria-hidden="true"${n==='cat-happy'?' style="--eo:none;--ec:inline"':''}><use href="#cat"/></svg>`}
const TAPS=['ছোট ছোট ধাপেই বড় সাফল্য আসে।','প্রতিদিন একটু করে এগোলেই হবে।','তুমি পারবে, Farishta!','একটু বিরতি নিয়ে আবার শুরু করো।'];let tapI=0;
function catMsg(n,d){if(!n)return 'আজ নতুন পরীক্ষা নেই। রিভিশনের জন্য সময়টা কাজে লাগাও।';if(d===n)return 'দারুণ! আজকের সব কাজ শেষ। এবার একটু বিশ্রাম নাও।';if(!d)return 'চলো শুরু করি! প্রথমে একটি টপিক পড়ো।';return 'চমৎকার চলছে! বাকিটুকুও একটু একটু করে শেষ করো।'}
function allDoneToday(){const t=tasksForDate(today());return t.length>0&&t.every(taskCompleted)}
function cheer(m){const el=document.getElementById('toast');el.innerHTML=mascot('cat-happy')+'<b></b>';el.lastChild.textContent=m;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function party(){const p=document.getElementById('party');p.innerHTML=`<div class="party-card" role="status"><div class="pa">${mascot('girl')}${mascot('cat-happy')}</div><strong>আজকের সব কাজ শেষ!</strong><span>Farishta, তুমি আজ দারুণ করেছ। একটু বিশ্রাম নাও।</span><button class="primary-btn" id="partyClose">ঠিক আছে</button></div>`;p.classList.add('show');clearTimeout(party.t);party.t=setTimeout(closeParty,9000)}
function closeParty(){document.getElementById('party').classList.remove('show')}
function migrate(){if(!ui.designV2){if(profile.theme==='emerald'){profile.theme='light';saveStore(LS.profile,profile)}ui.designV2=1;saveStore(LS.ui,ui)}profile.name='Farishta'}
function boot(){migrate();render();if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));document.getElementById('view').classList.add('enter');document.addEventListener('click',e=>{const c=e.target.closest('#catBtn');if(c){const b=document.getElementById('bubble');if(b)b.textContent=TAPS[tapI++%TAPS.length];c.classList.remove('hop');void c.offsetWidth;c.classList.add('hop')}if(e.target.closest('#partyClose'))closeParty()});document.getElementById('quickSettings').addEventListener('click',()=>setTab('settings'));document.getElementById('installTop').addEventListener('click',installApp);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installTop').classList.add('ready')});window.addEventListener('appinstalled',()=>toast('অ্যাপ ইনস্টল হয়েছে'));setInterval(checkReminders,30000);setInterval(updateGreeting,60000);checkReminders();document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();updateGreeting()}});}
boot();
</script>
</body>
